<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101d32">
    <title>Aurevia is offline</title>
    <style>
      :root {
        color-scheme: dark;
        --navy: #101d32;
        --paper: #f4efe6;
        --gold: #e5c486;
        --body-font: system-ui, sans-serif;
        --display-font: Georgia, serif;
      }
      body { margin: 0; background: var(--navy); color: var(--paper); font-family: var(--body-font); }
      main { max-width: 32rem; margin: 0 auto; padding: 4rem 1.25rem; }
      h1 { font: 2.5rem var(--display-font); }
      a { display: inline-flex; align-items: center; min-height: 48px; color: var(--gold); }
      a:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Reconnect to the internet to open Aurevia.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
